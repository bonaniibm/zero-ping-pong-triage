<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 760" width="1600" height="760" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#475569" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect width="1600" height="760" fill="#ffffff"/>
  <text x="60" y="64" font-size="30" font-weight="600" fill="#0f172a">The silent 401: what each plane can see</text>
  <text x="60" y="98" font-size="18" fill="#475569">A Service Bus key is regenerated in Azure. The Dataverse service endpoint still holds the old key.</text>

  <text x="60" y="190" font-size="19" font-weight="600" fill="#115e59">Azure plane</text>
  <line x1="240" y1="184" x2="1540" y2="184" stroke="#0f766e" stroke-width="3"/>
  <text x="60" y="470" font-size="19" font-weight="600" fill="#4c1d95">Dataverse plane</text>
  <line x1="240" y1="464" x2="1540" y2="464" stroke="#6d28d9" stroke-width="3"/>

  <circle cx="420" cy="184" r="9" fill="#0f766e"/>
  <rect x="290" y="208" width="260" height="78" rx="10" fill="#ccfbf1" stroke="#0f766e"/>
  <text x="420" y="238" text-anchor="middle" font-size="16" font-weight="600" fill="#134e4a">Events arrive normally</text>
  <text x="420" y="262" text-anchor="middle" font-size="14" fill="#115e59">Function logs AccountEventReceived</text>

  <circle cx="760" cy="184" r="9" fill="#b45309"/>
  <rect x="630" y="208" width="260" height="78" rx="10" fill="#fffbeb" stroke="#b45309"/>
  <text x="760" y="238" text-anchor="middle" font-size="16" font-weight="600" fill="#78350f">Key regenerated</text>
  <text x="760" y="262" text-anchor="middle" font-size="14" fill="#92400e">one line in the activity log</text>

  <circle cx="1180" cy="184" r="9" fill="#ffffff" stroke="#0f766e" stroke-width="3"/>
  <rect x="1010" y="208" width="340" height="78" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6 5"/>
  <text x="1180" y="238" text-anchor="middle" font-size="16" font-weight="600" fill="#334155">Nothing</text>
  <text x="1180" y="262" text-anchor="middle" font-size="14" fill="#475569">no errors, no dead letters, no alert</text>

  <circle cx="420" cy="464" r="9" fill="#6d28d9"/>
  <rect x="290" y="488" width="260" height="78" rx="10" fill="#ede9fe" stroke="#6d28d9"/>
  <text x="420" y="518" text-anchor="middle" font-size="16" font-weight="600" fill="#3b0764">Account created</text>
  <text x="420" y="542" text-anchor="middle" font-size="14" fill="#4c1d95">system job posts to Service Bus</text>

  <circle cx="1180" cy="464" r="9" fill="#b91c1c"/>
  <rect x="1010" y="488" width="340" height="100" rx="10" fill="#fef2f2" stroke="#b91c1c"/>
  <text x="1180" y="518" text-anchor="middle" font-size="16" font-weight="600" fill="#7f1d1d">System jobs waiting to retry</text>
  <text x="1180" y="542" text-anchor="middle" font-size="14" fill="#991b1b">Put token failed. status-code: 401</text>
  <text x="1180" y="564" text-anchor="middle" font-size="14" fill="#991b1b">InvalidSignature</text>

  <path d="M420 455 L420 300" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <path d="M1180 455 L1180 300" fill="none" stroke="#b91c1c" stroke-width="2" stroke-dasharray="7 6"/>
  <text x="1196" y="384" font-size="14" fill="#991b1b">rejected, never arrives</text>
  <text x="436" y="384" font-size="14" fill="#475569">delivered</text>

  <rect x="60" y="640" width="1480" height="80" rx="12" fill="#f1f5f9" stroke="#334155"/>
  <text x="800" y="674" text-anchor="middle" font-size="18" font-weight="600" fill="#0f172a">The cause is an Azure change. The only error message is in Dataverse.</text>
  <text x="800" y="702" text-anchor="middle" font-size="16" fill="#334155">An agent that reads one plane can report "no errors found". An agent that reads both names the owner in about 95 seconds.</text>
</svg>
